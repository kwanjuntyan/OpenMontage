name: CI

on:
  pull_request:
    branches:
      - main
      - team-main
  push:
    branches:
      - main
      - team-main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: make install-dev

      - name: Run lint smoke checks
        run: make lint

      - name: Run test suite
        run: make test

  batch-v2-linux-offline:
    name: Batch V2 Linux Offline Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Checkout, apt, and Python dependency setup may use the runner network.
      # The following test step is separately isolated after setup completes.
      - name: Install offline-gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg iproute2 util-linux
          make install-dev

      # This is intentionally before the no-egress boundary. It exercises pip's
      # real CPython 3.10/Linux x86_64 binary-wheel resolver for every exact pin.
      - name: Resolve Batch V2 CPython 3.10 Linux lock
        run: python -B scripts/batch_v2_verify_py310_lock.py resolve

      - name: Run Batch V2 test process without egress or credentials
        run: bash scripts/run_batch_v2_linux_offline_gate.sh

  policy-guard:
    name: Repository Policy & Binary Shield Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Unified Git & Binary Policy Check
        run: python scripts/check_git_policy.py --tree
